plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    // Local LAN testing: two offline-dev clients with distinct usernames and game dirs.
    // The default client / runClient task is left unchanged.
    runs {
        clientPlayer1 {
            client()
            configName = "Minecraft Client Player1"
            runDir = "run-player1"
            programArgs "--username", "Player1"
            ideConfigGenerated = true
        }

        clientPlayer2 {
            client()
            configName = "Minecraft Client Player2"
            runDir = "run-player2"
            programArgs "--username", "Player2"
            ideConfigGenerated = true
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def expandProps = [
            version   : project.version,
            loader_version: project.loader_version,
            mod_id    : project.mod_id,
            mod_name  : project.mod_name,
            mod_license: project.mod_license
    ]
    inputs.properties expandProps

    filesMatching("fabric.mod.json") {
        expand expandProps
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_${projectName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}
